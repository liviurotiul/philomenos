# Philomenos itself (the `philomenos` command, reports and tests).
#   conda env create -f envs/philomenos.yml
#   conda run -n philomenos pip install --no-deps -e .
name: philomenos
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.11
  - numpy=2.1.3
  - matplotlib-base=3.9.4
  - biopython=1.84
  - pyyaml=6.0.3
  - pytest=8.3.5
  - pip

# Tool group `snippy`: snippy, snippy-multi, snippy-core, snippy-clean_full_aln, snp-sites.
# Versions are the ones the pipeline was developed and validated with.
name: snippy
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  - snippy=4.6.0
  - snp-sites=2.5.1
  - samtools=1.20
  - bcftools=1.21
  - freebayes=1.3.6
